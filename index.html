<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/common.css?v=20">
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <div id="globe"></div>
  <nav class="topnav">
    <a href="index.html" class="active" data-i18n="navGlobe"></a>
    <a href="info.html" data-i18n="navInfo"></a>
  </nav>

  <div id="banner" class="banner" aria-live="polite">
    <strong data-i18n="bannerTitle"></strong>
    <span data-i18n="bannerText"></span>
  </div>

  <select id="lang-select" class="lang-select" data-i18n-aria="language">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
    <option value="ro">Română</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
  </select>

  <button id="library-btn" class="library-btn" type="button"><span aria-hidden="true">★</span> <span data-i18n="libraryBtn"></span></button>

  <aside id="library" class="library">
    <button id="library-close" class="library-close" type="button" data-i18n-aria="close">&times;</button>
    <div class="library-tabs">
      <button id="tab-fav" type="button" class="active" data-i18n="favorites"></button>
      <button id="tab-hist" type="button" data-i18n="history"></button>
    </div>
    <div id="library-actions" class="library-actions"></div>
    <p id="library-empty" class="library-empty"></p>
    <ul id="library-list" class="library-list"></ul>
  </aside>

  <aside id="panel" class="panel">
    <button id="panel-close" class="panel-close" data-i18n-aria="close">&times;</button>
    <div class="panel-header">
      <img id="panel-flag" class="panel-flag" alt="">
      <h2 id="panel-name"></h2>
    </div>
    <div id="panel-time-row" class="panel-time-row">
      <div id="panel-time-label" class="panel-label"></div>
      <div id="panel-time" class="panel-time"></div>
      <div id="panel-date" class="panel-date"></div>
    </div>
    <div id="player-wrap" class="player-wrap" hidden>
      <video id="player" controls playsinline></video>
      <iframe id="embed-frame" class="embed-frame" hidden
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
      <div id="player-msg" class="player-msg"></div>
      <div id="player-title" class="player-title"></div>
      <div id="embed-note" class="embed-note" hidden>
        <span id="embed-hint"></span>
        <a id="embed-link" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>

    <div class="channels-sticky">
      <h3 id="channels-title" class="channels-title" data-i18n="channels"></h3>
      <input id="channel-search" class="channel-search" type="search" autocomplete="off" data-i18n-placeholder="search">
    </div>
    <p id="channels-empty" class="channels-empty"></p>
    <ul id="channel-list" class="channel-list"></ul>
  </aside>

  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="i18n/en.js?v=20"></script>
  <script src="i18n/de.js?v=20"></script>
  <script src="i18n/ro.js?v=20"></script>
  <script src="i18n/fr.js?v=20"></script>
  <script src="i18n/es.js?v=20"></script>
  <script src="js/i18n.js?v=20"></script>
  <script src="data/timezones.js?v=20"></script>
  <script src="data/channels.js?v=20"></script>
  <script src="js/library.js?v=20"></script>
  <script src="js/panel.js?v=20"></script>
  <script src="js/globe.js?v=20"></script>
</body>
</html>
